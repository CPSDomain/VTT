# Builds the Tabletop apps for Windows and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push --tags
# The release notes come from that version's section in CHANGELOG.md (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run by hand from the Actions tab: builds everything, publishes nothing

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Electron and the build tools are downloaded from GitHub; keep them between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # those downloads sometimes time out on GitHub's side: try up to three times
      - name: Install
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retrying in 20 seconds…"; sleep 20
          done
          exit 1
      - name: Build Tabletop DM
        run: npx electron-builder --win --config build/dm.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build Tabletop Player
        run: npx electron-builder --win --config build/player.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: apps-win
          path: |
            dist/dm/*.exe
            dist/dm/*.zip
            dist/player/*.exe
            dist/player/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: apps-win
      - name: Check the tag matches the version
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; fi
      - name: Gather files and release notes
        run: node scripts/release.js
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release create "v$v" dist/release/*.exe dist/release/*.zip --title "Tabletop $v" --notes-file "dist/RELEASE_NOTES-$v.md" --latest
