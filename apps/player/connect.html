<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http: https:">
<title>Tabletop</title>
<style>
  :root { --panel:#1c1c1c; --line:#2f2f2f; --text:#e8e8e8; --dim:#9a9a9a; --accent:#e8390e; --accent2:#ff6b35; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#121212 radial-gradient(circle at 30% 20%, #1f1a18, #121212 60%); color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
  form { width:380px; background:var(--panel); border-radius:12px; padding:30px; border-top:3px solid var(--accent); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .brand { font-weight:800; letter-spacing:.16em; font-size:22px; text-align:center; }
  .brand span { color:var(--accent); }
  .sub { color:var(--dim); text-align:center; margin:6px 0 24px; }
  label { display:block; font-size:12px; color:var(--dim); margin:14px 0 6px; }
  input { width:100%; font:inherit; color:var(--text); background:#262626; border:1px solid var(--line); border-radius:7px; padding:10px 12px; }
  input:focus { outline:none; border-color:var(--accent2); }
  button { width:100%; margin-top:22px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:7px; padding:11px; cursor:pointer; }
  button:hover { background:var(--accent2); }
  button:disabled { opacity:.6; cursor:wait; }
  #err { color:#fca5a5; font-size:13px; margin-top:12px; min-height:18px; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<form id="f">
  <div class="brand">TABLE<span>TOP</span></div>
  <div class="sub">Join your DM's table</div>
  <label for="addr">Server address</label>
  <input id="addr" placeholder="192.168.1.20:3000" required autofocus spellcheck="false">
  <div class="hint">Your DM sees this at the top right of their screen.</div>
  <label for="name">Your name</label>
  <input id="name" placeholder="e.g. Alice" required maxlength="24">
  <div class="hint">Use the same name each session: the DM assigns tokens to it.</div>
  <div id="codeBox" hidden>
    <label for="code">Table passcode</label>
    <input id="code" maxlength="40" autocomplete="off" spellcheck="false">
    <div class="hint">This table has a passcode. Your DM can tell you it.</div>
  </div>
  <button id="go">Connect</button>
  <div id="err"></div>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  try { $('addr').value = localStorage.getItem('addr') || ''; $('name').value = localStorage.getItem('name') || ''; } catch {}
  const savedCode = (a) => { try { return localStorage.getItem('code:' + a) || ''; } catch { return ''; } };
  if ($('addr').value) $('name').focus();
  if (new URLSearchParams(location.search).get('left')) $('err').textContent = '';

  function normalise(raw) {
    let a = raw.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//i.test(a)) a = 'http://' + a;
    const u = new URL(a);
    if (u.protocol === 'http:' && !u.port) u.port = '3000';
    return u.origin;
  }

  $('f').onsubmit = async (e) => {
    e.preventDefault();
    $('err').textContent = '';
    let origin;
    try { origin = normalise($('addr').value); } catch { $('err').textContent = 'That doesn\'t look like an address. Try something like 192.168.1.20:3000'; return; }
    const name = $('name').value.trim();
    $('go').disabled = true; $('go').textContent = 'Connecting…';
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 5000);
    try {
      const r = await fetch(origin + '/api/ping', { signal: ctl.signal });
      const info = await r.json();
      if (info.app !== 'tabletop') throw new Error('not tabletop');
      try { localStorage.setItem('addr', $('addr').value.trim()); localStorage.setItem('name', name); } catch {}
      let code = '';
      if (info.passcode) {
        code = $('codeBox').hidden ? savedCode(origin) : $('code').value.trim();
        if (!code) { // ask for it; the table checks it when we join
          $('codeBox').hidden = false; $('code').focus();
          $('go').disabled = false; $('go').textContent = 'Connect'; return;
        }
        try { localStorage.setItem('code:' + origin, code); } catch {}
      }
      location.href = origin + '/?name=' + encodeURIComponent(name) + (code ? '#code=' + encodeURIComponent(code) : '');
    } catch (err) {
      $('err').textContent = err.name === 'AbortError' || err instanceof TypeError
        ? 'Couldn\'t reach the table. Check the address, that the DM has Tabletop DM open, and, from outside the DM\'s network, that you have their internet address.'
        : 'Something answered at that address, but it isn\'t a Tabletop server.';
      $('go').disabled = false; $('go').textContent = 'Connect';
    } finally { clearTimeout(t); }
  };
</script>
</body>
</html>
